name: Deploy to Cloudflare

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Target Pulumi stack (staging or prod)
        required: true
        default: staging
        type: choice
        options:
          - staging
          - prod
      skip_smoke:
        description: Skip post-deploy HTTP smoke checks
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.stack }}
  cancel-in-progress: false

env:
  BUN_NPM_VERSION: "1.4.5-canary.20261119.1"

jobs:
  deploy:
    name: deploy (${{ inputs.stack }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.stack }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22 for Pulumi runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Bun toolchain
        run: |
          npm install -g --prefix "$HOME/.local" --allow-scripts=bun "bun@${BUN_NPM_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bun" --revision
      - name: Install Pulumi CLI
        uses: pulumi/setup-pulumi@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run full verification gate before deploy
        run: bun run verify
      - name: Deploy Cloudflare Worker, apply remote D1 migrations, and verify smoke checks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
          PULUMI_BACKEND_URL: ${{ secrets.PULUMI_BACKEND_URL }}
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
          SMOKE_BOT_TOKEN: ${{ secrets.SMOKE_BOT_TOKEN }}
        run: |
          if [ "${{ inputs.skip_smoke }}" = "true" ]; then
            bun run deploy -- --stack "${{ inputs.stack }}" --skip-smoke
          else
            bun run deploy -- --stack "${{ inputs.stack }}"
          fi

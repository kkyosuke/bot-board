name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  BUN_NPM_VERSION: "1.4.5-canary.20261119.1"

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22 for Pulumi IaC check
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Bun toolchain
        run: |
          npm install -g --prefix "$HOME/.local" --allow-scripts=bun "bun@${BUN_NPM_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/bun" --revision
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun fmt --check
      - name: Run linter
        run: bun lint
      - name: Check TypeScript types
        run: bun check
      - name: Check doc and guardrail rules
        run: bun run check:guardrails
      - name: Run test suite
        run: bun test
      - name: Build client bundle
        run: bun run build
      - name: Build Cloudflare Worker bundle
        run: bun run build:worker
      - name: Build Pulumi IaC Node.js entrypoint
        run: bun run build:infra
      - name: Validate Pulumi Cloudflare IaC
        run: bun run infra:preview
      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run Playwright E2E suite
        run: bun run test:e2e
      - name: Run Full-Stack Vertical MVP E2E suite (All 12 ACs)
        run: bun run test:e2e:fullstack

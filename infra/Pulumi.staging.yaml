config:
  bot-board:appEnv: staging
  bot-board:rateLimitNamespaceId: "1001"
  bot-board:rateLimitRequests: "120"
  bot-board:rateLimitPeriodSeconds: "60"
  bot-board:workerCpuMsLimit: "10000"
  bot-board:enableWorkersDev: "true"
  # Required before `pulumi up` (set via `pulumi config set` / `--secret` or GitHub Env/Secrets):
  # - cloudflare:apiToken (or CLOUDFLARE_API_TOKEN env var)
  # - bot-board:accountId
  # - bot-board:betterAuthUrl (auto-derived from https://<hostname> when bot-board:hostname is set)
  # - bot-board:trustedOrigins (optional; defaults to betterAuthUrl)
  # - bot-board:ownerEmail (single owner email for Passkey + Email/Password bootstrap)
  # - bot-board:betterAuthSecret (--secret)
  # Optional autonomous worker LLM provider (grok | gemini | meta-muse; default: grok):
  # - bot-board:workerLlmProvider
  # - bot-board:xaiApiKey (--secret) / xaiModel (default: grok-3-mini) / xaiApiUrl
  # - bot-board:geminiApiKey (--secret) / geminiModel (default: gemini-3.5-flash-lite) / geminiApiUrl
  # - bot-board:metaModelApiKey (--secret) / metaModel (default: muse-spark-1.3) / metaApiUrl
  # Optional custom domain:
  # - bot-board:zoneId
  # - bot-board:hostname
  # - bot-board:routePattern
